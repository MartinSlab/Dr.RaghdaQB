  <g fill="#dbeafe" font-size="18" font-family="Arial, sans-serif" font-weight="700">
    <text x="84" y="58" fill="#dbeafe">E</text>
    <text x="192" y="65" fill="#dbeafe">F</text>
    <text x="65" y="178" fill="#dbeafe">v</text>
